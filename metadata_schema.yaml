# Metadata schema — field names and types for extraction.
# Subject-specific terms belong here (and later in controlled_vocabularies), not in code.
# This version uses free-text lists. Vocabularies are deferred (see doc/architecture.md Futures).

version: 1
fields:
  topic:
    type: list
    required: false
    description: Social factors and/or health conditions
  geography:
    type: list
    required: false
  population:
    type: list
    required: false
  time_period:
    type: list
    required: false

controlled_vocabularies: {}
